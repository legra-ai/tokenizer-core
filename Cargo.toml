[package]
name = "tokenizer-core"
version = "0.1.0"
description = "Generic zero-copy token infrastructure for Logos lexers"
authors = ["DataRoad Inc, Delaware, USA, trading as Legra"]
edition = "2024"
rust-version = "1.97.1"
build = "build.rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/tokenizer-core"
readme = "README.md"
keywords = ["lexer", "tokenizer", "logos", "parser", "zero-copy"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
logos = "0.16"

[build-dependencies]
rhusky = "0.0.6"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
